<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* Variables de color para la Pokedex */
        :root {
            --rojo: #cc0000;
            --rojo-oscuro: #8f0000;
            --blanco: #ffffff;
            --crema: #fff8f0;
            --negro: #222222;
            --amarillo: #ffcb05;
            --turquesa: #1ecfd4;
            --azul-pokemon: #2450a4;
            --turquesa-oscuro: #0e8a90;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
            background-color: var(--crema);
            color: var(--negro);
            position: relative;
            overflow-x: hidden;
            padding: 30px 15px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icono-flotante {
            position: absolute;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
        }

        .encabezado {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
            border-radius: 16px 16px 40px 16px;
            padding: 20px 25px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
            border: 3px solid var(--negro);
        }

        .luces-pokedex {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .lente-pokedex {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4fd8dc, var(--turquesa-oscuro) 45%, #0e8a90 100%);
            border: 4px solid var(--blanco);
            box-shadow: 0 0 0 3px var(--negro), 0 3px 8px rgba(0, 0, 0, 0.4);
            animation: parpadeo 1.6s ease-in-out infinite;
        }

        @keyframes parpadeo {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(0.3);
            }
        }

        .luz {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--negro);
        }

        .luz-roja {
            background-color: #ff3b3b;
            box-shadow: 0 0 8px 2px #ff3b3b;
        }

        .luz-amarilla {
            background-color: var(--amarillo);
            box-shadow: 0 0 8px 2px var(--amarillo);
        }

        .luz-verde {
            background-color: #4fd66b;
            box-shadow: 0 0 8px 2px #4fd66b;
        }

        .luces-pokedex.estado-buscando .luz {
            background-color: var(--amarillo) !important;
            box-shadow: 0 0 10px 3px var(--amarillo) !important;
            animation: parpadeo-led 0.8s ease-in-out infinite;
        }

        .luces-pokedex.estado-error .luz {
            background-color: #ff2020 !important;
            box-shadow: 0 0 10px 3px #ff2020 !important;
            animation: parpadeo-led 0.6s ease-in-out infinite;
        }

        .luces-pokedex.estado-reset .luz {
            background-color: #4fd66b !important;
            box-shadow: 0 0 10px 3px #4fd66b !important;
            animation: parpadeo-led 0.5s ease-in-out 2;
        }

        @keyframes parpadeo-led {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        h1 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            color: var(--amarillo);
            text-align: center;
            margin: 5px 0 18px 0;
            font-size: 68px;
            letter-spacing: 1px;
            -webkit-text-stroke: 4px var(--azul-pokemon);
            text-shadow:
                4px 4px 0 var(--azul-pokemon),
                7px 7px 0 #1a3a7a;
            line-height: 1;
        }

        .fila-input {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        #pokemon-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        #btn-buscar,
        #btn-random {
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-buscar:hover,
        #btn-random:hover {
            background-color: var(--amarillo);
            transform: translateY(-1px);
        }

        .signo-interrogacion {
            color: var(--amarillo);
            -webkit-text-stroke: 1px var(--negro);
            font-weight: 800;
            font-size: 16px;
        }

        #btn-comparar,
        #btn-reset {
            display: none;
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-comparar.visible {
            display: inline-flex;
            align-items: center;
        }

        #btn-reset.visible {
            display: inline-flex;
            align-items: center;
        }

        #btn-comparar:hover:not(:disabled),
        #btn-reset:hover:not(:disabled) {
            background-color: var(--amarillo);
            transform: translateY(-1px);
        }

        #btn-comparar:disabled,
        #btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #btn-comparar.activo {
            background-color: var(--amarillo);
            box-shadow: 0 0 0 3px var(--rojo-oscuro);
        }

        .tarjeta {
            width: 100%;
            max-width: 900px;
            background-color: var(--blanco);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border: 3px solid var(--color-tipo, var(--rojo));
            overflow: hidden;
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .tarjeta>div {
            padding: 20px;
        }

        .seccion-info {
            border-right: 2px dashed #ecd6d6;
        }

        .seccion-debilidades {
            border-right: 2px dashed #ecd6d6;
        }

        .tarjeta h2 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--color-tipo, var(--rojo-oscuro));
            text-align: center;
            font-size: 26px;
        }

        .tarjeta h3,
        .tarjeta h4 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            color: var(--blanco);
            background-color: var(--color-tipo, var(--rojo));
            padding: 7px 12px;
            border-radius: 8px;
            margin: 0 0 14px 0;
            text-align: center;
        }

        .seccion-info img:first-of-type {
            display: block;
            margin: 0 auto 12px;
            max-width: 130px;
            image-rendering: pixelated;
        }

        .estadisticas {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .chip-estadistica {
            background-color: var(--crema);
            border: 1.5px solid var(--color-tipo, var(--rojo));
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .fila-insignias {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 10px 0;
        }

        .insignia {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 58px;
        }

        .insignia .icono-tipo {
            width: 30px;
            height: 30px;
            border-radius: 7px;
        }

        .insignia span {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
        }

        .bloque-debilidad-tipo {
            margin-bottom: 14px;
        }

        .bloque-debilidad-tipo strong {
            display: block;
            text-align: center;
            color: var(--color-tipo, var(--rojo-oscuro));
            margin-bottom: 6px;
        }

        .seccion-movimientos {
            display: flex;
            flex-direction: column;
        }

        .lista-movimientos {
            max-height: 260px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .lista-movimientos p {
            margin: 4px 0;
            padding: 6px 10px;
            background-color: var(--crema);
            border-left: 3px solid var(--color-tipo, var(--rojo));
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .lista-movimientos::-webkit-scrollbar {
            width: 6px;
        }

        .lista-movimientos::-webkit-scrollbar-thumb {
            background-color: var(--color-tipo, var(--rojo));
            border-radius: 10px;
        }

        .fila-botones {
            grid-column: 1 / -1;
            background-color: var(--crema);
            border-top: 2px solid var(--color-tipo, var(--rojo));
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 16px;
        }

        .fila-botones button {
            padding: 14px 22px;
            min-width: 130px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-tipo, var(--rojo));
            color: var(--blanco);
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .fila-botones button:hover {
            filter: brightness(0.85);
            transform: translateY(-2px);
        }

        .fila-botones .btn-grito {
            background-color: var(--negro);
        }

        .contenedor-comparacion .btn-grito {
            width: 200px;
        }

        .tarjeta.legendaria {
            position: relative;
            animation: pulso-legendario 2.8s ease-in-out infinite;
        }

        @keyframes pulso-legendario {

            0%,
            100% {
                border-color: var(--color-tipo, var(--rojo));
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 18px 2px var(--color-tipo, var(--rojo));
            }

            50% {
                border-color: #e8e8ec;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 26px 6px rgba(255, 255, 255, 0.85);
            }
        }

        .tarjeta.legendaria::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 35%;
            height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-20deg);
            animation: destello-legendario 2.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }

        @keyframes destello-legendario {
            0% {
                left: -60%;
            }

            55% {
                left: 130%;
            }

            100% {
                left: 130%;
            }
        }

        .texto-legendario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 14px 0;
            background: linear-gradient(90deg, #b8860b 10%, #ffe9a8 35%, #fff8e0 50%, #ffe9a8 65%, #b8860b 90%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1.5px var(--color-tipo, var(--rojo));
            animation: brillo-texto 4s linear infinite;
        }

        @keyframes brillo-texto {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: -250% center;
            }
        }

        .estrella-legendaria {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            animation: parpadeo-estrella 4s ease-in-out infinite;
        }

        @keyframes parpadeo-estrella {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.6);
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

        .modal-contenido {
            background-color: var(--blanco);
            border-radius: 18px;
            border: 4px solid var(--rojo);
            padding: 30px;
            text-align: center;
            max-width: 320px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: var(--rojo);
            color: var(--blanco);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-contenido img {
            width: 120px;
            height: 120px;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        .modal-contenido p {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--rojo-oscuro);
            margin: 0;
        }

        .modal-buscando-contenido {
            border-color: var(--amarillo);
        }

        .modal-buscando-contenido p {
            color: #b8860b;
        }

        .spinner-pokebola {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 6px solid var(--crema);
            border-top: 6px solid var(--amarillo);
            animation: girar-spinner 0.9s linear infinite;
        }

        @keyframes girar-spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .modal-comparar-contenido {
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-comparar-contenido input {
            padding: 10px 14px;
            border-radius: 20px;
            border: 2px solid var(--rojo);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .modal-comparar-contenido #btn-submit-comparar {
            margin-top: 6px;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background-color: var(--rojo);
            color: var(--blanco);
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-comparar-contenido #btn-submit-comparar:hover {
            background-color: var(--rojo-oscuro);
        }

        /* Contenedor para las 2 tarjetas lado a lado */
        .contenedor-comparacion {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            align-items: start;
        }

        .contenedor-comparacion .tarjeta {
            width: 100%;
            max-width: none;
            grid-template-columns: 1fr;
        }

        @media (max-width: 750px) {
            .contenedor-comparacion {
                grid-template-columns: 1fr;
            }

            .seccion-info,
            .seccion-debilidades {
                border-right: none;
                border-bottom: 2px dashed #ecd6d6;
            }

            .icono-flotante {
                display: none;
            }

            h1 {
                font-size: 40px;
                -webkit-text-stroke: 2.5px var(--azul-pokemon);
                text-shadow: 2.5px 2.5px 0 var(--azul-pokemon), 4px 4px 0 #1a3a7a;
            }

            .lente-pokedex {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

        <circle cx="17" cy="17" r="4" fill="#222" />
    </svg>
    <svg class="icono-flotante" style="bottom: 2%; right: 15%;" width="40" height="40" viewBox="0 0 70 70">
        <circle cx="35" cy="35" r="30" fill="none" stroke="#222" stroke-width="4" />
        <line x1="5" y1="35" x2="65" y2="35" stroke="#222" stroke-width="4" />
        <circle cx="35" cy="35" r="8" fill="none" stroke="#222" stroke-width="4" />
    </svg>

    <div class="encabezado">
        <div class="luces-pokedex" id="luces-pokedex">
            <div class="lente-pokedex"></div>
            <div class="luz luz-roja"></div>
            <div class="luz luz-amarilla"></div>
            <div class="luz luz-verde"></div>
        </div>
        <h1>Pokedex</h1>
        <div class="fila-input">
            <input type="text" id="pokemon-input" placeholder="Ingresa el nombre o ID del Pokémon">
            <button id="btn-buscar">Buscar</button>
            <button id="btn-random"><span class="signo-interrogacion">?</span> Aleatorio</button>
            <button id="btn-comparar" disabled>
                <svg width="18" height="14" viewBox="0 0 40 24" style="vertical-align:-2px; margin-right:4px;">
                    <text x="0" y="18" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18"
                        fill="currentColor">VS</text>
                </svg>Comparar
            </button>
            <button id="btn-reset" disabled>🔄 Reset</button>
        </div>
    </div>

    <div id="resultado">
    </div>
    <!-- Ventana emergente: Pokémon no encontrado, con su grito repitiéndose -->
    <div class="modal-overlay" id="modal-no-encontrado">
        <div class="modal-contenido">
            <button class="btn-cerrar-modal" id="btn-cerrar-modal">✕</button>
            <img id="gif-no-encontrado" src="" alt="Pokémon no encontrado">
            <p id="mensaje-no-encontrado">¡Pokémon no encontrado!</p>
        </div>
    </div>

    <div class="modal-overlay" id="modal-buscando">
        <div class="modal-contenido modal-buscando-contenido">
            <div class="spinner-pokebola"></div>
            <p>Buscando Pokémon...</p>
        </div>
    </div>

    <script>
        // Variables globales
        const input = document.getElementById('pokemon-input');
        const button = document.getElementById('btn-buscar');
        const resultado = document.getElementById('resultado');
        const buttonRandom = document.getElementById('btn-random');
        const buttonComparar = document.getElementById('btn-comparar');
        const lucesPokedex = document.getElementById('luces-pokedex');
        const modalNoEncontrado = document.getElementById('modal-no-encontrado');
        const gifNoEncontrado = document.getElementById('gif-no-encontrado');
        const btnCerrarModal = document.getElementById('btn-cerrar-modal');
        const buttonReset = document.getElementById('btn-reset');
        let urlGritoActual = "";
        let IdActual = null;
        let modoComparacion = false;      // ¿estamos esperando el 2do Pokémon?
        let datosPokemon1 = null;         // guarda TODO el objeto que regresa obtenerDatosPokemon del 1er Pokémon
        let intervaloSincronizado = null; // para sincronizar animaciones si ambos son legendarios (lo usamos más adelante)
        let ultimoIdNoEncontrado = null;
        let intervaloSonidoModal = null;
        let datosActuales = null; // guarda los datos completos del Pokémon que está en pantalla ahora mismo


        const modalBuscando = document.getElementById('modal-buscando');
        // Funciones para mostrar y ocultar la ventana emergente de "Buscando Pokémon"
        function mostrarModalBuscando() {
            modalBuscando.style.display = "flex";
        }

        function ocultarModalBuscando() {
            modalBuscando.style.display = "none";
        }

        // Traducciones de tipos al español
        const tiposEnEspanol = {
            normal: "Normal", fire: "Fuego", water: "Agua", electric: "Eléctrico",
            grass: "Planta", ice: "Hielo", fighting: "Lucha", poison: "Veneno",
            ground: "Tierra", flying: "Volador", psychic: "Psíquico", bug: "Bicho",
            rock: "Roca", ghost: "Fantasma", dragon: "Dragón", dark: "Siniestro",
            steel: "Acero", fairy: "Hada"
        };

        // Colores de fondo por tipo
        const coloresPorTipo = {
            normal: "#a8a878", fire: "#e8620f", water: "#4287f5", electric: "#e8c000",
            grass: "#4caf50", ice: "#5cd0d0", fighting: "#c03028", poison: "#a040a0",
            ground: "#d9a441", flying: "#8f7dea", psychic: "#f85888", bug: "#8fa021",
            rock: "#b8a038", ghost: "#6a5698", dragon: "#5537d6", dark: "#5b4a3f",
            steel: "#7d7d99", fairy: "#e57ea0"
        };

        // Muestra la ventana emergente con un Pokémon animado aleatorio y su grito repitiéndose cada 5s
        async function mostrarModalNoEncontrado(mensaje) {
            document.getElementById('mensaje-no-encontrado').textContent = mensaje || "¡Pokémon no encontrado!";
            let idAleatorio;
            do {
                idAleatorio = Math.floor(Math.random() * 649) + 1;
            } while (idAleatorio === ultimoIdNoEncontrado);
            ultimoIdNoEncontrado = idAleatorio;

            const urlGif = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${idAleatorio}.gif`;
            gifNoEncontrado.src = urlGif;
            modalNoEncontrado.style.display = "flex";

            // Intentamos reproducir el grito del Pokémon, pero si falla, la ventana sigue funcionando igual
            try {
                const respuestaModal = await fetch(`https://pokeapi.co/api/v2/pokemon/${idAleatorio}`);
                const dataModal = await respuestaModal.json();
                const urlGritoModal = dataModal.cries.latest;

                const sonidoModal = new Audio(urlGritoModal);
                sonidoModal.play();

                if (intervaloSonidoModal) {
                    clearInterval(intervaloSonidoModal);
                }
                intervaloSonidoModal = setInterval(function () {
                    const sonidoRepetido = new Audio(urlGritoModal);
                    sonidoRepetido.play();
                }, 5000);
            } catch (error) {
                // si falla el sonido, la ventana sigue funcionando igual, solo sin audio
            }
        }
        // Función para cerrar la ventana emergente y detener el sonido
        function cerrarModalNoEncontrado() {
            modalNoEncontrado.style.display = "none";
            lucesPokedex.classList.remove("estado-error");
            if (intervaloSonidoModal) {
                clearInterval(intervaloSonidoModal);
                intervaloSonidoModal = null;
            }
        }
        // Agregamos el evento de clic al botón de cerrar la ventana emergente
        btnCerrarModal.addEventListener('click', cerrarModalNoEncontrado);

        modalNoEncontrado.addEventListener('click', function (event) {
            if (event.target === modalNoEncontrado) {
                cerrarModalNoEncontrado();
            }
        });

        // Función recursiva para buscar un Pokémon en la cadena de evolución
        function buscarEnCadena(nodo, nombreBuscado) {
            if (nodo.species.name === nombreBuscado) {
                return nodo;
            }
            for (const hijo of nodo.evolves_to) {
                const encontrado = buscarEnCadena(hijo, nombreBuscado);
                if (encontrado) {
                    return encontrado;
                }
            }
            return null;
        }
        // Función para igualar las alturas de las secciones de información, debilidades y movimientos en la comparación
        function igualarAlturasComparacion() {
            const selectores = ['.seccion-info', '.seccion-debilidades', '.seccion-movimientos'];

            selectores.forEach(function (selector) {
                const cajas = document.querySelectorAll('.contenedor-comparacion ' + selector);
                if (cajas.length < 2) return;

                cajas.forEach(function (caja) { caja.style.minHeight = "auto"; });

                let alturaMaxima = 0;
                cajas.forEach(function (caja) {
                    if (caja.offsetHeight > alturaMaxima) {
                        alturaMaxima = caja.offsetHeight;
                    }
                });

                cajas.forEach(function (caja) {
                    caja.style.minHeight = alturaMaxima + "px";
                });
            });
        }

        // Función principal para obtener los datos del Pokémon y mostrarlos en la tarjeta
        async function obtenerDatosPokemon(valor) {
            const pokemonName = valor;

            // Intentamos obtener los datos del Pokémon, y si falla, mostramos la ventana emergente
            try {
                const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);
                const data = await respuesta.json();

                const respuestaEspecie = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonName}`);
                const dataEspecie = await respuestaEspecie.json();

                const iconoEstrella = "<svg class='estrella-legendaria' viewBox='0 0 24 24'><path d='M12 2 L14.9 8.6 L22 9.3 L16.5 14.1 L18.2 21 L12 17.3 L5.8 21 L7.5 14.1 L2 9.3 L9.1 8.6 Z' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='1.2'/></svg>";
                const defsGradiente = "<svg width='0' height='0'><defs><linearGradient id='gradientePlata' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#8a8a8a'/><stop offset='40%' stop-color='#f5f5f5'/><stop offset='60%' stop-color='#ffffff'/><stop offset='100%' stop-color='#8a8a8a'/></linearGradient></defs></svg>";

                const mensajeLegendario = dataEspecie.is_legendary ? defsGradiente + "<p class='texto-legendario'>" + iconoEstrella + "Pokémon Legendario" + iconoEstrella + "</p>" : "";

                const respuestaCadena = await fetch(dataEspecie.evolution_chain.url);
                const dataCadena = await respuestaCadena.json();

                const nodoActual = buscarEnCadena(dataCadena.chain, data.name);
                let piedraFinal = "";

                // Si el Pokémon tiene evoluciones que requieren un ítem, mostramos el ícono del ítem y su nombre
                if (nodoActual) {
                    for (const hijo of nodoActual.evolves_to) {
                        const detalle = hijo.evolution_details[0];
                        if (detalle.trigger.name === "use-item") {
                            const nombrePiedra = detalle.item.name;
                            const urlIconoPiedra = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${nombrePiedra}.png`;
                            const nombrePiedraFormateado = nombrePiedra.split("-").map(function (palabra) {
                                return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                            }).join(" ");
                            piedraFinal += "<div class='insignia' style='margin:12px auto;'><img class='icono-tipo' style='width:36px;height:36px;' src='" + urlIconoPiedra + "' alt='" + nombrePiedraFormateado + "' onerror=\"this.style.display='none'\"><span>Evoluciona con " + nombrePiedraFormateado + "</span></div>";
                        }
                    }
                }

                // Obtenemos la imagen animada del Pokémon si está disponible, de lo contrario usamos la imagen estática
                const spriteAnimado = data.sprites.versions["generation-v"]["black-white"].animated.front_default;
                const imagenFinal = spriteAnimado ? spriteAnimado : data.sprites.front_default;

                const tipoPrincipalIngles = data.types[0].type.name;
                const colorTipoPrincipal = coloresPorTipo[tipoPrincipalIngles] ? coloresPorTipo[tipoPrincipalIngles] : "#cc0000";

                // Creamos las insignias de tipos y debilidades
                let tiposFinal = "";
                let debilidadesFinal = "";
                for (const tipoObj of data.types) {
                    const nombreTipoIngles = tipoObj.type.name;
                    const respuestaTipo = await fetch(`https://pokeapi.co/api/v2/type/${nombreTipoIngles}`);
                    const dataTipo = await respuestaTipo.json();

                    const nombreTipoEspanol = tiposEnEspanol[nombreTipoIngles] ? tiposEnEspanol[nombreTipoIngles] : nombreTipoIngles;
                    const urlIconoTipo = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${dataTipo.id}.png`;

                    tiposFinal += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoTipo + "' alt='" + nombreTipoEspanol + "'><span>" + nombreTipoEspanol + "</span></div>";

                    let insigniasDebilidad = "";
                    dataTipo.damage_relations.double_damage_from.forEach(function (debilidadObj) {
                        const nombreIngles = debilidadObj.name;
                        const nombreEspanol = tiposEnEspanol[nombreIngles] ? tiposEnEspanol[nombreIngles] : nombreIngles;

                        const partesUrl = debilidadObj.url.split("/");
                        const idDebilidad = partesUrl[partesUrl.length - 2];
                        const urlIconoDebilidad = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${idDebilidad}.png`;

                        insigniasDebilidad += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoDebilidad + "' alt='" + nombreEspanol + "'><span>" + nombreEspanol + "</span></div>";
                    });

                    debilidadesFinal += "<div class='bloque-debilidad-tipo'><strong>" + nombreTipoEspanol + "</strong><div class='fila-insignias'>" + insigniasDebilidad + "</div></div>";
                }

                const movimientosPorNivel = data.moves.filter(function (movimientoObj) {
                    return movimientoObj.version_group_details.some(function (detalle) {
                        return detalle.move_learn_method.name === "level-up";
                    });
                });

                const movimientosConNivel = movimientosPorNivel.map(function (movimientoObj) {
                    const detalleNivel = movimientoObj.version_group_details.find(function (d) {
                        return d.move_learn_method.name === "level-up";
                    });
                    return { nombre: movimientoObj.move.name, nivel: detalleNivel.level_learned_at };
                });

                movimientosConNivel.sort(function (a, b) {
                    return a.nivel - b.nivel;
                });

                let movimientosFinal = "";
                movimientosConNivel.forEach(function (movObj) {
                    const nombreFormateado = movObj.nombre.split("-").map(function (palabra) {
                        return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                    }).join(" ");
                    movimientosFinal += "<p>Nv. " + movObj.nivel + " - " + nombreFormateado + "</p>";
                });

                return {
                    data,
                    dataEspecie,
                    colorTipoPrincipal,
                    tiposFinal,
                    debilidadesFinal,
                    movimientosFinal,
                    mensajeLegendario,
                    piedraFinal,
                    imagenFinal
                };

            } catch (error) {
                throw error;
            }
        }

        function generarTarjetaHTML(datos, esComparacion) {
            // "Desempacamos" el objeto que regresa obtenerDatosPokemon,
            const { data, dataEspecie, colorTipoPrincipal, tiposFinal,
                debilidadesFinal, movimientosFinal, mensajeLegendario,
                piedraFinal, imagenFinal } = datos;

            // estas dos SÍ dependen de "datos" y hay que recalcularlas aquí,
            const nombreCapitalizado = data.name.charAt(0).toUpperCase() + data.name.slice(1);
            const claseLegendaria = dataEspecie.is_legendary ? " legendaria" : "";

            return "<div class='tarjeta" + claseLegendaria + "' style='--color-tipo: " + colorTipoPrincipal + ";'>" +
                "<div class='seccion-info'>" +
                "<h2>" + nombreCapitalizado + "</h2>" +
                "<img src='" + imagenFinal + "' alt='" + data.name + "'>" +
                "<div class='estadisticas'>" +
                "<div class='chip-estadistica'>#" + data.id + "</div>" +
                "<div class='chip-estadistica'>📏 " + (data.height / 10) + " m</div>" +
                "<div class='chip-estadistica'>⚖️ " + (data.weight / 10) + " kg</div>" +
                "</div>" +
                "<div class='fila-insignias'>" + tiposFinal + "</div>" +
                mensajeLegendario + piedraFinal +
                "</div>" +
                "<div class='seccion-debilidades'>" +
                "<h4>Debilidades</h4>" +
                debilidadesFinal +
                "</div>" +
                "<div class='seccion-movimientos'>" +
                "<h3>Movimientos</h3>" +
                "<div class='lista-movimientos'>" + movimientosFinal + "</div>" +
                "</div>" +
                "<div class='fila-botones'>" +
                "<button class='btn-grito' data-sonido='" + data.cries.latest + "'>🔊 Escuchar de nuevo</button>" +
                (esComparacion ? "" : "<button class='btn-anterior'>⬅️ Anterior</button><button class='btn-siguiente'>Siguiente ➡️</button>") +
                "</div>" +
                "</div>";
        }

        // Función principal para buscar un Pokémon y mostrar su tarjeta
        async function buscarPokemon(valor) {
            if (!valor || valor.toString().trim() === "") {
                mostrarModalNoEncontrado("¡Campo vacío! Escribe un nombre o ID.");
                return;
            }
            if (modoComparacion) {
                compararPokemon(valor);
                return;
            }

            mostrarModalBuscando();
            lucesPokedex.classList.remove("estado-error");
            lucesPokedex.classList.add("estado-buscando");

            try {
                const datos = await obtenerDatosPokemon(valor);
                const htmlTarjeta = generarTarjetaHTML(datos, false);
                ocultarModalBuscando();
                resultado.innerHTML = htmlTarjeta;
                const sonido = new Audio(datos.data.cries.latest);
                sonido.play();
                urlGritoActual = datos.data.cries.latest;
                IdActual = datos.data.id;
                buttonComparar.classList.add('visible');
                buttonReset.classList.add('visible');
                buttonComparar.disabled = false;
                buttonReset.disabled = false;
                input.value = "";
                lucesPokedex.classList.remove("estado-buscando");
                datosActuales = datos;

            } catch (error) {
                ocultarModalBuscando();
                resultado.innerHTML = "";
                lucesPokedex.classList.remove("estado-buscando");
                lucesPokedex.classList.add("estado-error");
                buttonReset.classList.add('visible');
                buttonReset.disabled = false;
                mostrarModalNoEncontrado();

            }
        }

        // Función para comparar dos Pokémon y mostrar sus tarjetas lado a lado
        async function compararPokemon(valor) {
            mostrarModalBuscando();
            lucesPokedex.classList.remove("estado-error");
            lucesPokedex.classList.add("estado-buscando");

            try {
                // 1) Trae los datos del 2do Pokémon
                const datos2 = await obtenerDatosPokemon(valor);

                // 2) Genera el HTML de ambas tarjetas
                const html1 = generarTarjetaHTML(datosPokemon1, true);
                const html2 = generarTarjetaHTML(datos2, true);
                ocultarModalBuscando();
                // 3) Pinta las 2 juntas
                resultado.innerHTML = "<div class='contenedor-comparacion'>" + html1 + html2 + "</div>";
                igualarAlturasComparacion();
                const sonido1 = new Audio(datosPokemon1.data.cries.latest);
                sonido1.play();

                setTimeout(function () {
                    const sonido2 = new Audio(datos2.data.cries.latest);
                    sonido2.play();
                }, 2000);

                modoComparacion = false;
                buttonComparar.classList.remove('activo');
                buttonComparar.disabled = false;
                lucesPokedex.classList.remove("estado-buscando");

            } catch (error) {
                ocultarModalBuscando();
                lucesPokedex.classList.remove("estado-buscando");
                lucesPokedex.classList.add("estado-error");
                buttonReset.classList.add('visible');
                buttonReset.disabled = false;
                mostrarModalNoEncontrado();
            }

        }

        button.addEventListener('click', function () {
            buscarPokemon(input.value);
        });
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                buscarPokemon(input.value);
            }
        });
        buttonRandom.addEventListener('click', function () {
            const randomId = Math.floor(Math.random() * 1010) + 1;
            buscarPokemon(randomId);
        });

        buttonComparar.addEventListener('click', function () {
            datosPokemon1 = datosActuales;
            modoComparacion = true;
            buttonComparar.classList.add('activo');
            buttonComparar.disabled = true;
            input.value = "";
        });

        buttonReset.addEventListener('click', function () {
            resultado.innerHTML = "";
            input.value = "";
            urlGritoActual = "";
            IdActual = null;
            datosActuales = null;
            datosPokemon1 = null;
            modoComparacion = false;
            buttonComparar.classList.remove('activo', 'visible');
            buttonComparar.disabled = true;
            buttonReset.classList.remove('visible');
            buttonReset.disabled = true;
            lucesPokedex.classList.remove("estado-buscando", "estado-error");
            lucesPokedex.classList.add("estado-reset");
            setTimeout(function () {
                lucesPokedex.classList.remove("estado-reset");
            }, 1000);
        });


        resultado.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-grito')) {
                const sonido = new Audio(event.target.dataset.sonido);
                sonido.play();
            }
            if (event.target.classList.contains('btn-anterior')) {
                buscarPokemon(IdActual - 1);
            }
            if (event.target.classList.contains('btn-siguiente')) {
                buscarPokemon(IdActual + 1);
            }
        });
    </script>
</body>

</html>
