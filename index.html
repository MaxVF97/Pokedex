<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Bruno+Ace+SC&family=Carattere&family=Changa:wght@200..800&family=Mea+Culpa&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo: #cc0000;
            --rojo-oscuro: #8f0000;
            --blanco: #ffffff;
            --crema: #fff8f0;
            --negro: #222222;
            --amarillo: #ffcb05;
            --turquesa: #1ecfd4;
            --azul-pokemon: #2450a4;
            --turquesa-oscuro: #0e8a90;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
            background-color: var(--crema);
            color: var(--negro);
            position: relative;
            overflow-x: hidden;
            padding: 30px 15px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icono-flotante {
            position: absolute;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .encabezado {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
            border-radius: 16px 16px 40px 16px;
            padding: 20px 25px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
            border: 3px solid var(--negro);
        }

        .luces-pokedex {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .lente-pokedex {
            position: relative;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background-color: #0a2a2c;
            border: 4px solid var(--blanco);
            box-shadow: 0 0 0 3px var(--negro), 0 3px 8px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .lente-pokedex::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4fd8dc, var(--turquesa-oscuro) 45%, #0e8a90 100%);
            animation: parpadeo 1.6s ease-in-out infinite;
        }

        @keyframes parpadeo {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(0.3); }
        }

        .luz {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--negro);
        }

        .luz-roja { background-color: #ff3b3b; box-shadow: 0 0 8px 2px #ff3b3b; }
        .luz-amarilla { background-color: var(--amarillo); box-shadow: 0 0 8px 2px var(--amarillo); }
        .luz-verde { background-color: #4fd66b; box-shadow: 0 0 8px 2px #4fd66b; }

        .luces-pokedex.estado-buscando .luz {
            background-color: #2f7fe0 !important;
            box-shadow: 0 0 10px 3px #2f7fe0 !important;
            animation: parpadeo-led 0.8s ease-in-out infinite;
        }

        .luces-pokedex.estado-error .luz {
            background-color: #ff2020 !important;
            box-shadow: 0 0 10px 3px #ff2020 !important;
            animation: parpadeo-led 0.6s ease-in-out infinite;
        }

        .luces-pokedex.estado-reset .luz {
            background-color: #4fd66b !important;
            box-shadow: 0 0 10px 3px #4fd66b !important;
            animation: parpadeo-led 0.5s ease-in-out 2;
        }

        /* Mientras suena un grito, cada LED parpadea con su propio color
           (no se sobreescribe el color, solo se agrega la animación).
           Cada uno arranca en un momento distinto para que se note un
           efecto de "cascada" (rojo -> amarillo -> verde), en vez de
           que los 3 parpadeen exactamente igual y a la vez. */
        .luces-pokedex.estado-sonido .luz {
            animation: parpadeo-led 0.6s ease-in-out infinite;
        }

        .luces-pokedex.estado-sonido .luz-roja {
            animation-delay: 0s;
        }

        .luces-pokedex.estado-sonido .luz-amarilla {
            animation-delay: 0.2s;
        }

        .luces-pokedex.estado-sonido .luz-verde {
            animation-delay: 0.4s;
        }

        @keyframes parpadeo-led {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        h1 {
            font-family: 'Bruno Ace SC', sans-serif;
            font-weight: 400;
            color: var(--amarillo);
            text-align: center;
            margin: 5px 0 18px 0;
            font-size: 60px;
            letter-spacing: 1px;
            -webkit-text-stroke: 3px var(--azul-pokemon);
            text-shadow: 4px 4px 0 var(--azul-pokemon), 7px 7px 0 #1a3a7a;
            line-height: 1.1;
        }

        .fila-input {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        #pokemon-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        #btn-buscar, #btn-random {
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-buscar:hover, #btn-random:hover {
            background-color: var(--amarillo);
            transform: translateY(-1px);
        }

        .signo-interrogacion {
            color: var(--amarillo);
            -webkit-text-stroke: 1px var(--negro);
            font-weight: 800;
            font-size: 16px;
        }

        #btn-comparar, #btn-reset, #btn-favoritos {
            display: none;
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-comparar.visible, #btn-reset.visible, #btn-favoritos.visible {
            display: inline-flex;
            align-items: center;
        }

        #btn-comparar:hover:not(.activo), #btn-reset:hover:not(:disabled), #btn-favoritos:hover {
            background-color: var(--amarillo);
            transform: translateY(-1px);
        }

        #btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #btn-comparar.activo {
            background-color: var(--rojo);
            color: var(--blanco);
            border-color: var(--rojo-oscuro);
            box-shadow: 0 0 0 3px var(--rojo-oscuro);
        }

        #btn-comparar.activo:hover {
            background-color: var(--rojo-oscuro);
            transform: translateY(-1px);
        }

        .tarjeta {
            width: 100%;
            max-width: 900px;
            background-color: var(--blanco);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border: 3px solid var(--color-tipo, var(--rojo));
            overflow: hidden;
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        .tarjeta > div { padding: 20px; }

        .btn-favorito {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            color: #cccccc;
            z-index: 5;
            transition: 0.2s;
            padding: 2px 4px;
        }

        .btn-favorito:hover { transform: scale(1.15); }

        .btn-favorito.activo {
            color: var(--amarillo);
            text-shadow: 0 0 8px rgba(255, 203, 5, 0.8);
        }

        .seccion-info { border-right: 2px dashed #ecd6d6; }

        .seccion-info, .seccion-debilidades, .seccion-movimientos, .seccion-stats {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                var(--textura-tipo, none);
            background-repeat: no-repeat, repeat;
            background-size: cover, 34px 34px;
        }

        .seccion-debilidades { border-right: 2px dashed #ecd6d6; }

        .tarjeta h2 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--color-tipo, var(--rojo-oscuro));
            text-align: center;
            font-size: 26px;
        }

        .tarjeta.legendaria h2 {
            font-family: 'Tangerine', cursive;
            font-weight: 700;
            font-size: 46px;
        }

        .tarjeta h3, .tarjeta h4 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            color: var(--blanco);
            background-color: var(--color-tipo, var(--rojo));
            padding: 7px 12px;
            border-radius: 8px;
            margin: 0 0 14px 0;
            text-align: center;
        }

        .seccion-info img:first-of-type {
            display: block;
            margin: 0 auto 12px;
            max-width: 130px;
            image-rendering: pixelated;
        }

        .estadisticas {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .chip-estadistica {
            background-color: var(--crema);
            border: 1.5px solid var(--color-tipo, var(--rojo));
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .seccion-stats { display: flex; flex-direction: column; }

        .fila-stat { margin-bottom: 10px; }

        .fila-stat .etiqueta-stat {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .barra-stat-fondo {
            background-color: var(--crema);
            border: 1.5px solid var(--color-tipo, var(--rojo));
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
        }

        .barra-stat-relleno {
            height: 100%;
            background-color: var(--color-tipo, var(--rojo));
            border-radius: 8px 0 0 8px;
        }

        .tarjeta.legendaria .barra-stat-relleno {
            animation: respiracion-brillo 2.4s ease-in-out infinite;
        }

        @keyframes respiracion-brillo {
            0%, 100% {
                box-shadow: 0 0 4px 1px var(--color-tipo, var(--rojo));
                filter: brightness(1);
            }
            50% {
                box-shadow:
                    0 0 10px 3px #ffffff,
                    0 0 22px 8px var(--color-tipo, var(--rojo));
                filter: brightness(1.7);
            }
        }

        .fila-insignias {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 10px 0;
        }

        .insignia {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 58px;
        }

        .insignia .icono-tipo { width: 30px; height: 30px; border-radius: 7px; }

        .insignia span {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
        }

        .bloque-debilidad-tipo { margin-bottom: 14px; }

        .bloque-debilidad-tipo strong {
            display: block;
            text-align: center;
            color: var(--color-tipo, var(--rojo-oscuro));
            margin-bottom: 6px;
        }

        .seccion-movimientos {
            display: flex;
            flex-direction: column;
            border-right: 2px dashed #ecd6d6;
        }

        .lista-movimientos {
            max-height: 260px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .lista-movimientos p {
            margin: 4px 0;
            padding: 6px 10px;
            background-color: var(--crema);
            border-left: 3px solid var(--color-tipo, var(--rojo));
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .lista-movimientos::-webkit-scrollbar { width: 6px; }
        .lista-movimientos::-webkit-scrollbar-thumb {
            background-color: var(--color-tipo, var(--rojo));
            border-radius: 10px;
        }

        .fila-botones {
            grid-column: 1 / -1;
            background-color: var(--crema);
            border-top: 2px solid var(--color-tipo, var(--rojo));
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 16px;
        }

        .fila-botones button {
            padding: 14px 22px;
            min-width: 130px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-tipo, var(--rojo));
            color: var(--blanco);
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .fila-botones button:hover {
            filter: brightness(0.85);
            transform: translateY(-2px);
        }

        .fila-botones .btn-grito { background-color: var(--negro); }
        .contenedor-comparacion .btn-grito { width: 200px; }

        .tarjeta.legendaria {
            position: relative;
            animation: pulso-legendario 2.8s ease-in-out infinite;
        }

        @keyframes pulso-legendario {
            0%, 100% {
                border-color: var(--color-tipo, var(--rojo));
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 18px 2px var(--color-tipo, var(--rojo));
            }
            50% {
                border-color: #e8e8ec;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 26px 6px rgba(255, 255, 255, 0.85);
            }
        }

        .tarjeta.legendaria::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 35%;
            height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-20deg);
            animation: destello-legendario 2.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }

        @keyframes destello-legendario {
            0% { left: -60%; }
            55% { left: 130%; }
            100% { left: 130%; }
        }

        .texto-legendario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Mea Culpa', cursive;
            font-weight: 400;
            font-size: 34px;
            text-align: center;
            margin: 14px 0;
            background: linear-gradient(90deg, #b8860b 10%, #ffe9a8 35%, #fff8e0 50%, #ffe9a8 65%, #b8860b 90%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px var(--color-tipo, var(--rojo));
            animation: brillo-texto 4s linear infinite;
        }

        @keyframes brillo-texto {
            0% { background-position: 0% center; }
            100% { background-position: -250% center; }
        }

        .icono-legendario {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            animation: parpadeo-estrella 4s ease-in-out infinite;
        }

        @keyframes parpadeo-estrella {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.6); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

        .modal-contenido {
            background-color: var(--blanco);
            border-radius: 18px;
            border: 4px solid var(--rojo);
            padding: 30px;
            text-align: center;
            max-width: 320px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: var(--rojo);
            color: var(--blanco);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-contenido img {
            width: 120px;
            height: 120px;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        .modal-contenido p {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--rojo-oscuro);
            margin: 0;
        }

        .modal-buscando-contenido { border-color: var(--amarillo); }
        .modal-buscando-contenido p { color: #b8860b; }

        .spinner-pokebola {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 6px solid var(--crema);
            border-top: 6px solid var(--amarillo);
            animation: girar-spinner 0.9s linear infinite;
        }

        @keyframes girar-spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-favoritos-contenido {
            max-width: 360px;
            text-align: left;
        }

        .modal-favoritos-contenido h3 {
            font-family: 'Baloo 2', sans-serif;
            color: var(--rojo-oscuro);
            text-align: center;
            margin: 0 0 14px 0;
        }

        .modal-lleno-contenido {
            border-color: var(--amarillo);
        }

        .modal-lleno-contenido p {
            color: #b8860b;
            font-size: 16px;
        }

        .icono-lleno {
            font-size: 52px;
            margin-bottom: 10px;
            animation: parpadeo-estrella 1s ease-in-out infinite;
        }

        #lista-favoritos {
            max-height: 320px;
            overflow-y: auto;
        }

        .fila-favorito {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 8px;
            border-bottom: 1.5px dashed #ecd6d6;
        }

        .fila-favorito:last-child { border-bottom: none; }

        .fila-favorito span {
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
        }

        .fila-favorito div { display: flex; gap: 6px; flex-shrink: 0; }

        .btn-ver-favorito, .btn-quitar-favorito {
            border: none;
            border-radius: 10px;
            padding: 6px 10px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-ver-favorito {
            background-color: var(--amarillo);
            color: var(--negro);
        }

        .btn-ver-favorito:hover { filter: brightness(0.9); }

        .btn-quitar-favorito {
            background-color: var(--rojo);
            color: var(--blanco);
        }

        .btn-quitar-favorito:hover { background-color: var(--rojo-oscuro); }

        .contenedor-comparacion {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            align-items: start;
        }

        .contenedor-comparacion.seleccion-hecha {
            grid-template-columns: 1fr;
        }

        .contenedor-comparacion .tarjeta {
            width: 100%;
            max-width: none;
            grid-template-columns: 1fr;
        }

        .banner-seleccion {
            background-color: var(--amarillo);
            color: var(--negro);
            font-weight: 700;
            text-align: center;
            padding: 12px 20px;
            border-radius: 12px;
            border: 2px solid var(--negro);
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .banner-seleccion.visible { display: flex; }

        .btn-confirmar-seleccion {
            display: none;
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-confirmar-seleccion.visible { display: inline-block; }

        .btn-confirmar-seleccion:hover {
            background-color: var(--negro);
            color: var(--amarillo);
        }

        .contenedor-comparacion.modo-seleccion .tarjeta {
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .contenedor-comparacion.modo-seleccion .tarjeta:hover {
            transform: scale(1.015);
            box-shadow: 0 0 0 4px var(--amarillo);
        }

        .tarjeta-conservada { box-shadow: 0 0 0 6px var(--amarillo) !important; }

        /* Estado de previsualización: atenuada pero visible y clickeable,
           para que el usuario pueda cambiar de opinión antes de confirmar */
        .tarjeta-descartada {
            opacity: 0.32;
            filter: grayscale(70%);
            transition: opacity 0.35s ease, filter 0.35s ease;
        }

        /* Se aplica SOLO al confirmar: desvanecido gradual antes de ocultarse */
        .tarjeta-descartada.desvaneciendo {
            animation: desvanecer-tarjeta 0.6s ease forwards;
        }

        @keyframes desvanecer-tarjeta {
            0% { opacity: 0.32; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.94); }
        }

        .tarjeta-oculta { display: none !important; }

        @media (max-width: 750px) {
            .contenedor-comparacion { grid-template-columns: 1fr; }

            .tarjeta {
                grid-template-columns: 1fr;
            }

            .seccion-info, .seccion-debilidades, .seccion-movimientos {
                border-right: none;
                border-bottom: 2px dashed #ecd6d6;
            }
            .icono-flotante { display: none; }
            h1 {
                font-size: 34px;

    <script>
        const input = document.getElementById('pokemon-input');

        const textoBannerSeleccion = document.getElementById('texto-banner-seleccion');
        const btnConfirmarSeleccion = document.getElementById('btn-confirmar-seleccion');
        const buttonFavoritos = document.getElementById('btn-favoritos');
        const modalFavoritos = document.getElementById('modal-favoritos');
        const btnCerrarModalFavoritos = document.getElementById('btn-cerrar-modal-favoritos');
        const listaFavoritosDiv = document.getElementById('lista-favoritos');
        const modalFavoritosLleno = document.getElementById('modal-favoritos-lleno');

        let urlGritoActual = "";
        let IdActual = null;
        let modoComparacion = false;
        let datosPokemon1 = null;
        let intervaloSincronizado = null;
        let ultimoIdNoEncontrado = null;
        let intervaloSonidoModal = null;
        let datosActuales = null;
        let datosComparacion1 = null;
        let datosComparacion2 = null;
        let esperandoSeleccionTarjeta = false;
        let candidatoEsPrimera = null;

        // ==== SISTEMA CENTRALIZADO DE SONIDOS ====
        // Guarda cada Audio que se reproduce y cada setTimeout pendiente de la
        // secuencia de comparación, para poder cortarlos TODOS de golpe en
        // cualquier momento (evita sonidos duplicados o que sigan sonando
        // después de que el usuario ya hizo otra cosa)
        let audiosActivos = [];
        let timeoutsSonidoComparacion = [];

        function reproducirSonido(url) {
            const audio = new Audio(url);
            audiosActivos.push(audio);
            audio.addEventListener('ended', function () {
                audiosActivos = audiosActivos.filter(function (a) { return a !== audio; });
            });
            audio.play();
            return audio;
        }

        function detenerTodosLosSonidos() {
            audiosActivos.forEach(function (audio) {
                audio.pause();
                audio.currentTime = 0;
            });
            audiosActivos = [];

            timeoutsSonidoComparacion.forEach(function (id) { clearTimeout(id); });
            timeoutsSonidoComparacion = [];

            if (intervaloSonidoModal) {
                clearInterval(intervaloSonidoModal);
                intervaloSonidoModal = null;
            }

            lucesPokedex.classList.remove('estado-sonido');
        }
        // ==== FIN SISTEMA DE SONIDOS ====

        let favoritos = JSON.parse(localStorage.getItem('pokedexFavoritos') || '[]');

        const modalBuscando = document.getElementById('modal-buscando');
        function mostrarModalBuscando() { modalBuscando.style.display = "flex"; }
        function ocultarModalBuscando() { modalBuscando.style.display = "none"; }

        function activarModoComparacionUI() {
            buttonComparar.classList.add('activo');
            buttonComparar.disabled = false;
            textoBtnComparar.textContent = "Cancelar";
        }

        function desactivarModoComparacionUI() {
            buttonComparar.classList.remove('activo');
            buttonComparar.disabled = false;
            textoBtnComparar.textContent = "Comparar";
        }

        function cancelarModoComparacion() {
            modoComparacion = false;
            esperandoSeleccionTarjeta = false;
            candidatoEsPrimera = null;
            bannerSeleccion.classList.remove('visible');
            btnConfirmarSeleccion.classList.remove('visible');
            desactivarModoComparacionUI();

            const contenedor = document.querySelector('.contenedor-comparacion');
            if (contenedor) {
                contenedor.classList.remove('modo-seleccion', 'seleccion-hecha');
                contenedor.querySelectorAll('.tarjeta').forEach(function (tarjeta) {
                    tarjeta.classList.remove('tarjeta-conservada', 'tarjeta-descartada', 'desvaneciendo', 'tarjeta-oculta');
                });
            }
            input.value = "";
        }

        function guardarFavoritos() {
            localStorage.setItem('pokedexFavoritos', JSON.stringify(favoritos));
            actualizarBotonFavoritos();
        }

        function actualizarBotonFavoritos() {
            if (favoritos.length > 0) {
                buttonFavoritos.classList.add('visible');
            } else {
                buttonFavoritos.classList.remove('visible');
            }
        }

        function esFavorito(id) {
            return favoritos.some(function (f) { return f.id === id; });
        }

        function mostrarModalFavoritosLleno() {
            modalFavoritosLleno.style.display = "flex";
            setTimeout(function () {
                modalFavoritosLleno.style.display = "none";
            }, 2500);
        }

        modalFavoritosLleno.addEventListener('click', function () {
            modalFavoritosLleno.style.display = "none";
        });

        function toggleFavorito(id, nombre) {
            const indice = favoritos.findIndex(function (f) { return f.id === id; });
            if (indice >= 0) {
                favoritos.splice(indice, 1);
            } else {
                if (favoritos.length >= 20) {
                    mostrarModalFavoritosLleno();
                    return;
                }
                favoritos.push({ id: id, nombre: nombre });
            }
            guardarFavoritos();
            actualizarEstrellasEnPantalla();
        }

        function actualizarEstrellasEnPantalla() {
            document.querySelectorAll('.btn-favorito').forEach(function (btn) {
                const id = parseInt(btn.dataset.id);
                const activo = esFavorito(id);
                btn.classList.toggle('activo', activo);
                btn.textContent = activo ? '★' : '☆';
            });
        }

        function renderizarListaFavoritos() {
            listaFavoritosDiv.innerHTML = "";
            favoritos.forEach(function (fav) {
                const fila = document.createElement('div');
                fila.className = 'fila-favorito';
                fila.innerHTML =
                    "<span>" + fav.nombre + "</span>" +
                    "<div>" +
                    "<button class='btn-ver-favorito' data-id='" + fav.id + "'>👁 Ver</button>" +
                    "<button class='btn-quitar-favorito' data-id='" + fav.id + "'>✕</button>" +
                    "</div>";
                listaFavoritosDiv.appendChild(fila);
            });
        }

        buttonFavoritos.addEventListener('click', function () {
            renderizarListaFavoritos();
            modalFavoritos.style.display = "flex";
        });

        btnCerrarModalFavoritos.addEventListener('click', function () {
            modalFavoritos.style.display = "none";
        });

        modalFavoritos.addEventListener('click', function (event) {
            if (event.target === modalFavoritos) modalFavoritos.style.display = "none";
        });

        listaFavoritosDiv.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-ver-favorito')) {
                const id = event.target.dataset.id;
                modalFavoritos.style.display = "none";
                buscarPokemon(id);
            }
            if (event.target.classList.contains('btn-quitar-favorito')) {
                const id = parseInt(event.target.dataset.id);
                favoritos = favoritos.filter(function (f) { return f.id !== id; });
                guardarFavoritos();
                renderizarListaFavoritos();
                actualizarEstrellasEnPantalla();
            }
        });

        actualizarBotonFavoritos();

        const tiposEnEspanol = {
            normal: "Normal", fire: "Fuego", water: "Agua", electric: "Eléctrico",
            grass: "Planta", ice: "Hielo", fighting: "Lucha", poison: "Veneno",
            ground: "Tierra", flying: "Volador", psychic: "Psíquico", bug: "Bicho",
            rock: "Roca", ghost: "Fantasma", dragon: "Dragón", dark: "Siniestro",

        };

        const statsEnEspanol = {
            hp: "PS", attack: "Ataque", defense: "Defensa",
            "special-attack": "At. Especial", "special-defense": "Def. Especial", speed: "Velocidad"
        };

        const coloresPorTipo = {
            normal: "#a8a878", fire: "#e8620f", water: "#4287f5", electric: "#e8c000",
            grass: "#4caf50", ice: "#5cd0d0", fighting: "#c03028", poison: "#a040a0",
            ground: "#d9a441", flying: "#8f7dea", psychic: "#f85888", bug: "#8fa021",
            rock: "#b8a038", ghost: "#6a5698", dragon: "#5537d6", dark: "#5b4a3f",
            steel: "#7d7d99", fairy: "#e57ea0"
        };

        async function mostrarModalNoEncontrado(mensaje) {
            document.getElementById('mensaje-no-encontrado').textContent = mensaje || "¡Pokémon no encontrado!";
            let idAleatorio;
            do {
                idAleatorio = Math.floor(Math.random() * 649) + 1;
            } while (idAleatorio === ultimoIdNoEncontrado);
            ultimoIdNoEncontrado = idAleatorio;

            const urlGif = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${idAleatorio}.gif`;
            gifNoEncontrado.src = urlGif;
            modalNoEncontrado.style.display = "flex";

            try {
                const respuestaModal = await fetch(`https://pokeapi.co/api/v2/pokemon/${idAleatorio}`);
                const dataModal = await respuestaModal.json();
                const urlGritoModal = dataModal.cries.latest;
                reproducirSonido(urlGritoModal);
                if (intervaloSonidoModal) clearInterval(intervaloSonidoModal);
                intervaloSonidoModal = setInterval(function () {
                    reproducirSonido(urlGritoModal);
                }, 5000);
            } catch (error) {}
        }

        function cerrarModalNoEncontrado() {
            modalNoEncontrado.style.display = "none";
            lucesPokedex.classList.remove("estado-error");
            if (intervaloSonidoModal) {
                clearInterval(intervaloSonidoModal);
                intervaloSonidoModal = null;
            }
        }

        btnCerrarModal.addEventListener('click', cerrarModalNoEncontrado);
        modalNoEncontrado.addEventListener('click', function (event) {
            if (event.target === modalNoEncontrado) cerrarModalNoEncontrado();
        });

        function buscarEnCadena(nodo, nombreBuscado) {
            if (nodo.species.name === nombreBuscado) return nodo;
            for (const hijo of nodo.evolves_to) {
                const encontrado = buscarEnCadena(hijo, nombreBuscado);
                if (encontrado) return encontrado;
            }
            return null;
        }

        function igualarAlturasComparacion() {
            const selectores = ['.seccion-info', '.seccion-debilidades', '.seccion-movimientos', '.seccion-stats'];
            selectores.forEach(function (selector) {
                const cajas = document.querySelectorAll('.contenedor-comparacion ' + selector);
                if (cajas.length < 2) return;
                cajas.forEach(function (caja) { caja.style.minHeight = "auto"; });
                let alturaMaxima = 0;
                cajas.forEach(function (caja) {
                    if (caja.offsetHeight > alturaMaxima) alturaMaxima = caja.offsetHeight;
                });
                cajas.forEach(function (caja) { caja.style.minHeight = alturaMaxima + "px"; });
            });
        }

        async function obtenerDatosPokemon(valor) {
            const pokemonName = valor;
            try {
                const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);
                const data = await respuesta.json();

                const respuestaEspecie = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonName}`);
                const dataEspecie = await respuestaEspecie.json();

                const iconoEspada = "<svg class='icono-legendario' viewBox='0 0 24 24'>" +
                    "<path d='M12 0.5 L14.3 3.2 L13.3 14 L10.7 14 L9.7 3.2 Z' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='0.6'/>" +
                    "<rect x='6.2' y='13.4' width='11.6' height='2.6' rx='0.7' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='0.6'/>" +
                    "<rect x='10.5' y='16' width='3' height='5.5' rx='0.9' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='0.6'/>" +
                    "<circle cx='12' cy='22.3' r='1.5' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='0.6'/>" +
                    "</svg>";
                const iconoEscudo = "<svg class='icono-legendario' viewBox='0 0 24 24'><path d='M12 1 L21 4.5 L21 11 C21 17 17 21 12 23 C7 21 3 17 3 11 L3 4.5 Z' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='1'/></svg>";
                const defsGradiente = "<svg width='0' height='0'><defs><linearGradient id='gradientePlata' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#8a8a8a'/><stop offset='40%' stop-color='#f5f5f5'/><stop offset='60%' stop-color='#ffffff'/><stop offset='100%' stop-color='#8a8a8a'/></linearGradient></defs></svg>";

                const mensajeLegendario = dataEspecie.is_legendary ? defsGradiente + "<p class='texto-legendario'>" + iconoEspada + "Pokémon Legendario" + iconoEscudo + "</p>" : "";

                const respuestaCadena = await fetch(dataEspecie.evolution_chain.url);
                const dataCadena = await respuestaCadena.json();

                const nodoActual = buscarEnCadena(dataCadena.chain, data.name);
                let piedraFinal = "";

                if (nodoActual) {
                    for (const hijo of nodoActual.evolves_to) {
                        const detalle = hijo.evolution_details[0];
                        if (detalle.trigger.name === "use-item") {
                            const nombrePiedra = detalle.item.name;
                            const urlIconoPiedra = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${nombrePiedra}.png`;
                            const nombrePiedraFormateado = nombrePiedra.split("-").map(function (palabra) {
                                return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                            }).join(" ");
                            piedraFinal += "<div class='insignia' style='margin:12px auto;'><img class='icono-tipo' style='width:36px;height:36px;' src='" + urlIconoPiedra + "' alt='" + nombrePiedraFormateado + "' onerror=\"this.style.display='none'\"><span>Evoluciona con " + nombrePiedraFormateado + "</span></div>";
                        }
                    }
                }

                const spriteAnimado = data.sprites.versions["generation-v"]["black-white"].animated.front_default;
                const imagenFinal = spriteAnimado ? spriteAnimado : data.sprites.front_default;

                const tipoPrincipalIngles = data.types[0].type.name;
                const colorTipoPrincipal = coloresPorTipo[tipoPrincipalIngles] ? coloresPorTipo[tipoPrincipalIngles] : "#cc0000";
                let urlIconoTipoPrincipal = "";

                let tiposFinal = "";
                let debilidadesFinal = "";
                for (const tipoObj of data.types) {
                    const nombreTipoIngles = tipoObj.type.name;
                    const respuestaTipo = await fetch(`https://pokeapi.co/api/v2/type/${nombreTipoIngles}`);
                    const dataTipo = await respuestaTipo.json();

                    const nombreTipoEspanol = tiposEnEspanol[nombreTipoIngles] ? tiposEnEspanol[nombreTipoIngles] : nombreTipoIngles;
                    const urlIconoTipo = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${dataTipo.id}.png`;

                    if (tiposFinal === "") urlIconoTipoPrincipal = urlIconoTipo;

                    tiposFinal += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoTipo + "' alt='" + nombreTipoEspanol + "'><span>" + nombreTipoEspanol + "</span></div>";

                    let insigniasDebilidad = "";
                    dataTipo.damage_relations.double_damage_from.forEach(function (debilidadObj) {
                        const nombreIngles = debilidadObj.name;
                        const nombreEspanol = tiposEnEspanol[nombreIngles] ? tiposEnEspanol[nombreIngles] : nombreIngles;
                        const partesUrl = debilidadObj.url.split("/");
                        const idDebilidad = partesUrl[partesUrl.length - 2];
                        const urlIconoDebilidad = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${idDebilidad}.png`;
                        insigniasDebilidad += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoDebilidad + "' alt='" + nombreEspanol + "'><span>" + nombreEspanol + "</span></div>";
                    });

                    debilidadesFinal += "<div class='bloque-debilidad-tipo'><strong>" + nombreTipoEspanol + "</strong><div class='fila-insignias'>" + insigniasDebilidad + "</div></div>";
                }

                let statsFinal = "";
                data.stats.forEach(function (statObj) {
                    const nombreStat = statsEnEspanol[statObj.stat.name] ? statsEnEspanol[statObj.stat.name] : statObj.stat.name;
                    const valorStat = statObj.base_stat;
                    const porcentaje = Math.min((valorStat / 255) * 100, 100);
                    statsFinal += "<div class='fila-stat'>" +
                        "<div class='etiqueta-stat'><span>" + nombreStat + "</span><span>" + valorStat + "</span></div>" +
                        "<div class='barra-stat-fondo'><div class='barra-stat-relleno' style='width:" + porcentaje + "%;'></div></div>" +
                        "</div>";
                });

                const movimientosPorNivel = data.moves.filter(function (movimientoObj) {
                    return movimientoObj.version_group_details.some(function (detalle) {
                        return detalle.move_learn_method.name === "level-up";
                    });
                });

                const movimientosConNivel = movimientosPorNivel.map(function (movimientoObj) {
                    const detalleNivel = movimientoObj.version_group_details.find(function (d) {
                        return d.move_learn_method.name === "level-up";
                    });
                    return { nombre: movimientoObj.move.name, nivel: detalleNivel.level_learned_at };
                });

                movimientosConNivel.sort(function (a, b) { return a.nivel - b.nivel; });

                let movimientosFinal = "";
                movimientosConNivel.forEach(function (movObj) {
                    const nombreFormateado = movObj.nombre.split("-").map(function (palabra) {
                        return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                    }).join(" ");
                    movimientosFinal += "<p>Nv. " + movObj.nivel + " - " + nombreFormateado + "</p>";
                });

                return {
                    data, dataEspecie, colorTipoPrincipal, urlIconoTipoPrincipal, tiposFinal,
                    debilidadesFinal, movimientosFinal, mensajeLegendario, piedraFinal, imagenFinal, statsFinal
                };
            } catch (error) {
                throw error;
            }
        }

        function generarTarjetaHTML(datos, esComparacion) {
            const { data, dataEspecie, colorTipoPrincipal, urlIconoTipoPrincipal, tiposFinal,
                debilidadesFinal, movimientosFinal, mensajeLegendario, piedraFinal, imagenFinal, statsFinal } = datos;

            const nombreCapitalizado = data.name.charAt(0).toUpperCase() + data.name.slice(1);
            const claseLegendaria = dataEspecie.is_legendary ? " legendaria" : "";
            const onloadImagen = esComparacion ? " onload=\"igualarAlturasComparacion()\"" : "";
            const claseEstrella = esFavorito(data.id) ? "activo" : "";
            const simboloEstrella = esFavorito(data.id) ? "★" : "☆";

            return "<div class='tarjeta" + claseLegendaria + "' style='--color-tipo: " + colorTipoPrincipal + "; --textura-tipo: url(" + urlIconoTipoPrincipal + ");'>" +
                "<button class='btn-favorito " + claseEstrella + "' data-id='" + data.id + "' data-nombre='" + nombreCapitalizado + "'>" + simboloEstrella + "</button>" +
                "<div class='seccion-info'>" +
                "<h2>" + nombreCapitalizado + "</h2>" +
                "<img src='" + imagenFinal + "' alt='" + data.name + "'" + onloadImagen + ">" +
                "<div class='estadisticas'>" +
                "<div class='chip-estadistica'>#" + data.id + "</div>" +
                "<div class='chip-estadistica'>📏 " + (data.height / 10) + " m</div>" +
                "<div class='chip-estadistica'>⚖️ " + (data.weight / 10) + " kg</div>" +
                "</div>" +
                "<div class='fila-insignias'>" + tiposFinal + "</div>" +
                mensajeLegendario + piedraFinal +
                "</div>" +
                "<div class='seccion-debilidades'>" +
                "<h4>Debilidades</h4>" +
                debilidadesFinal +
                "</div>" +
                "<div class='seccion-movimientos'>" +
                "<h3>Movimientos</h3>" +
                "<div class='lista-movimientos'>" + movimientosFinal + "</div>" +
                "</div>" +
                "<div class='seccion-stats'>" +
                "<h4>Estadísticas</h4>" +
                statsFinal +
                "</div>" +
                "<div class='fila-botones'>" +
                (esComparacion ? "" : "<button class='btn-anterior'>⬅️ Anterior</button>") +
                "<button class='btn-grito' data-sonido='" + data.cries.latest + "'>🔊 Escuchar de nuevo</button>" +
                (esComparacion ? "" : "<button class='btn-siguiente'>Siguiente ➡️</button>") +
                "</div>" +
                "</div>";
        }

        async function buscarPokemon(valor) {
            if (!valor || valor.toString().trim() === "") {
                mostrarModalNoEncontrado("¡Campo vacío! Escribe un nombre o ID.");
                return;
            }
            if (modoComparacion) {
                compararPokemon(valor);
                return;
            }

            mostrarModalBuscando();
            lucesPokedex.classList.remove("estado-error");
            lucesPokedex.classList.add("estado-buscando");

            try {
                const datos = await obtenerDatosPokemon(valor);
                const htmlTarjeta = generarTarjetaHTML(datos, false);
                ocultarModalBuscando();
                resultado.innerHTML = htmlTarjeta;
                reproducirSonido(datos.data.cries.latest);
                urlGritoActual = datos.data.cries.latest;
                IdActual = datos.data.id;
                buttonComparar.classList.add('visible');
                buttonReset.classList.add('visible');
                buttonComparar.disabled = false;
                buttonReset.disabled = false;
                input.value = "";
                lucesPokedex.classList.remove("estado-buscando");
                datosActuales = datos;

                // Cualquier búsqueda individual (normal, aleatoria, o desde favoritos)
                // invalida una comparación anterior: ya no hay 2 tarjetas en pantalla,
                // así que btnComparar debe iniciar una comparación NUEVA, no asumir que
                // ya existe una previa para elegir entre 2
                datosComparacion1 = null;
                datosComparacion2 = null;
            } catch (error) {
                ocultarModalBuscando();
                resultado.innerHTML = "";
                lucesPokedex.classList.remove("estado-buscando");
                lucesPokedex.classList.add("estado-error");
                buttonReset.classList.add('visible');
                buttonReset.disabled = false;
                mostrarModalNoEncontrado();
            }
        }

        async function compararPokemon(valor) {
            mostrarModalBuscando();
            lucesPokedex.classList.remove("estado-error");
            lucesPokedex.classList.add("estado-buscando");

            try {
                const datos2 = await obtenerDatosPokemon(valor);
                datosComparacion1 = datosPokemon1;
                datosComparacion2 = datos2;

                const html1 = generarTarjetaHTML(datosPokemon1, true);
                const html2 = generarTarjetaHTML(datos2, true);
                ocultarModalBuscando();
                resultado.innerHTML = "<div class='contenedor-comparacion'>" + html1 + html2 + "</div>";
                igualarAlturasComparacion();
                bannerSeleccion.classList.remove('visible');

                // 1) Sonido inmediato del Pokémon recién agregado (confirma la selección)
                reproducirSonido(datos2.data.cries.latest);

                // 2) 5s después: grito del Pokémon 1
                const idTimeout1 = setTimeout(function () {
                    reproducirSonido(datosPokemon1.data.cries.latest);

                    // 3) 2s después de ese: grito del Pokémon 2 otra vez, y termina la secuencia
                    const idTimeout2 = setTimeout(function () {
                        reproducirSonido(datos2.data.cries.latest);
                    }, 2000);
                    timeoutsSonidoComparacion.push(idTimeout2);
                }, 5000);
                timeoutsSonidoComparacion.push(idTimeout1);

                modoComparacion = false;
                desactivarModoComparacionUI();
                lucesPokedex.classList.remove("estado-buscando");
            } catch (error) {
                ocultarModalBuscando();
                lucesPokedex.classList.remove("estado-buscando");
                lucesPokedex.classList.add("estado-error");
                buttonReset.classList.add('visible');
                buttonReset.disabled = false;
                mostrarModalNoEncontrado();
            }
        }

        button.addEventListener('click', function () { buscarPokemon(input.value); });
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") buscarPokemon(input.value);
        });
        buttonRandom.addEventListener('click', function () {
            const randomId = Math.floor(Math.random() * 1010) + 1;
            buscarPokemon(randomId);
        });

        buttonComparar.addEventListener('click', function () {
            if (buttonComparar.classList.contains('activo')) {
                cancelarModoComparacion();
                return;
            }

            if (datosComparacion1 && datosComparacion2) {
                esperandoSeleccionTarjeta = true;
                candidatoEsPrimera = null;
                activarModoComparacionUI();
                textoBannerSeleccion.textContent = "¿Qué Pokémon quieres comparar? También puedes usar Aleatorio 🎲";
                btnConfirmarSeleccion.classList.remove('visible');
                bannerSeleccion.classList.add('visible');

                // Limpia por completo el estado visual de la ronda anterior
                // (si no, la tarjeta descartada la vez pasada se queda oculta para siempre)
                const contenedorPrevio = document.querySelector('.contenedor-comparacion');
                if (contenedorPrevio) {
                    contenedorPrevio.classList.remove('seleccion-hecha');
                    contenedorPrevio.querySelectorAll('.tarjeta').forEach(function (tarjeta) {
                        tarjeta.classList.remove('tarjeta-conservada', 'tarjeta-descartada', 'desvaneciendo', 'tarjeta-oculta');
                    });
                    contenedorPrevio.classList.add('modo-seleccion');
                }
            } else {
                datosPokemon1 = datosActuales;
                modoComparacion = true;
                activarModoComparacionUI();
                textoBannerSeleccion.textContent = "Ingresa ID / Pokémon o Aleatorio a comparar";
                btnConfirmarSeleccion.classList.remove('visible');
                bannerSeleccion.classList.add('visible');
                input.value = "";
            }
        });

        btnConfirmarSeleccion.addEventListener('click', function () {
            if (candidatoEsPrimera === null) return;

            const contenedor = document.querySelector('.contenedor-comparacion');
            const tarjetaDescartada = contenedor ? contenedor.querySelector('.tarjeta-descartada') : null;

            datosPokemon1 = candidatoEsPrimera ? datosComparacion1 : datosComparacion2;
            modoComparacion = true;
            esperandoSeleccionTarjeta = false;

            if (contenedor) contenedor.classList.remove('modo-seleccion');

            btnConfirmarSeleccion.classList.remove('visible');
            textoBannerSeleccion.textContent = "Escribe el ID / Pokémon o usa Aleatorio para el nuevo retador";
            input.value = "";

            // Dispara el desvanecido gradual; solo hasta que termine,
            // se oculta por completo y la tarjeta elegida ocupa todo el ancho
            if (tarjetaDescartada) {
                tarjetaDescartada.classList.add('desvaneciendo');
                setTimeout(function () {
                    tarjetaDescartada.classList.add('tarjeta-oculta');
                    if (contenedor) contenedor.classList.add('seleccion-hecha');
                }, 600);
            } else if (contenedor) {
                contenedor.classList.add('seleccion-hecha');
            }
        });

        buttonReset.addEventListener('click', function () {
            resultado.innerHTML = "";
            input.value = "";
            urlGritoActual = "";
            IdActual = null;
            datosActuales = null;
            datosPokemon1 = null;
            datosComparacion1 = null;
            datosComparacion2 = null;
            modoComparacion = false;
            esperandoSeleccionTarjeta = false;
            candidatoEsPrimera = null;
            desactivarModoComparacionUI();
            buttonComparar.classList.remove('visible');
            buttonComparar.disabled = true;
            buttonReset.classList.remove('visible');
            buttonReset.disabled = true;
            btnConfirmarSeleccion.classList.remove('visible');
            bannerSeleccion.classList.remove('visible');
            lucesPokedex.classList.remove("estado-buscando", "estado-error");
            lucesPokedex.classList.add("estado-reset");
            setTimeout(function () {
                lucesPokedex.classList.remove("estado-reset");
            }, 1000);
        });

        resultado.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-grito')) {
                const audioGrito = reproducirSonido(event.target.dataset.sonido);
                lucesPokedex.classList.add('estado-sonido');
                audioGrito.addEventListener('ended', function () {
                    lucesPokedex.classList.remove('estado-sonido');
                });
            }
            if (event.target.classList.contains('btn-anterior')) buscarPokemon(IdActual - 1);
            if (event.target.classList.contains('btn-siguiente')) buscarPokemon(IdActual + 1);

            if (event.target.classList.contains('btn-favorito')) {
                const id = parseInt(event.target.dataset.id);
                const nombre = event.target.dataset.nombre;
                toggleFavorito(id, nombre);
            }

            if (esperandoSeleccionTarjeta) {
                const tarjetaClickeada = event.target.closest('.tarjeta');
                if (tarjetaClickeada && !event.target.classList.contains('btn-favorito')) {
                    const contenedor = tarjetaClickeada.parentElement;
                    const tarjeta1 = contenedor.children[0];
                    const tarjeta2 = contenedor.children[1];
                    const esLaPrimera = tarjetaClickeada === tarjeta1;

                    tarjeta1.classList.remove('tarjeta-conservada', 'tarjeta-descartada');
                    tarjeta2.classList.remove('tarjeta-conservada', 'tarjeta-descartada');

                    if (esLaPrimera) {
                        tarjeta1.classList.add('tarjeta-conservada');
                        tarjeta2.classList.add('tarjeta-descartada');
                    } else {
                        tarjeta2.classList.add('tarjeta-conservada');
                        tarjeta1.classList.add('tarjeta-descartada');
                    }
                    // Nota: aquí ya NO se agrega "seleccion-hecha" -- el usuario
                    // todavía puede volver a hacer clic en la otra tarjeta para cambiar de opinión

                    candidatoEsPrimera = esLaPrimera;
                    btnConfirmarSeleccion.classList.add('visible');
                }
            }
        });

        // Cualquier clic en CUALQUIER parte de la página corta de inmediato todos
        // los sonidos activos (y cancela los pendientes de la secuencia de comparación).
        // Se usa fase de "captura" (tercer argumento true) para que esto se ejecute
        // ANTES que el manejador de clic específico del botón que se haya presionado --
        // así, si ese mismo clic va a reproducir un sonido nuevo, primero se corta
        // el anterior y luego se reproduce el nuevo, sin que se empalmen.
        document.addEventListener('click', function (event) {
            // La estrella de favoritos no debe cortar el sonido que esté sonando
            if (event.target.closest && event.target.closest('.btn-favorito')) return;
            detenerTodosLosSonidos();
        }, true);
    </script>
</body>
