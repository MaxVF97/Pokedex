<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
</head>

<body>
    <h1>Pokedex</h1>
    <input type="text" id="pokemon-input" placeholder="Ingresa el nombre o ID del Pokémon">
    <button id="btn-buscar">Buscar</button>
    <button id="btn-random">Aleatorio 🎲</button>
    <div id="resultado">
    </div>
    <script>
        // Obtener referencias a los elementos del DOM
        const input = document.getElementById('pokemon-input');
        const button = document.getElementById('btn-buscar');
        const resultado = document.getElementById('resultado');
        const buttonRandom = document.getElementById('btn-random');
        let urlGritoActual = "";
        let IdActual = null;

        // Diccionario para traducir los tipos de Pokémon al español
        const tiposEnEspanol = {
            normal: "Normal",
            fire: "Fuego",
            water: "Agua",
            electric: "Eléctrico",
            grass: "Planta",
            ice: "Hielo",
            fighting: "Lucha",
            poison: "Veneno",
            ground: "Tierra",
            flying: "Volador",
            psychic: "Psíquico",
            bug: "Bicho",
            rock: "Roca",
            ghost: "Fantasma",
            dragon: "Dragón",
            dark: "Siniestro",
            steel: "Acero",
            fairy: "Hada"
        };

        // Función para buscar un Pokémon por nombre o ID
        async function buscarPokemon(valor) {
            const pokemonName = valor;
            resultado.innerHTML = "<p>Buscando...</p>";

            // Primera petición: la info básica del Pokémon
            try {
                const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);
                const data = await respuesta.json();


                // Segunda petición: la info de "especie" trae si es legendario o no
                const respuestaEspecie = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonName}`);
                const dataEspecie = await respuestaEspecie.json();
                const mensajeLegendario = dataEspecie.is_legendary ? "<p>⭐ ¡Pokémon legendario! ⭐</p>" : "";


                // Obtener la imagen animada si existe, de lo contrario usar la estática
                const spriteAnimado = data.sprites.versions["generation-v"]["black-white"].animated.front_default;
                const imagenFinal = spriteAnimado ? spriteAnimado : data.sprites.front_default;

                // Obtener los tipos y debilidades del Pokémon
                let tiposFinal = "";
                let debilidadesFinal = "";
                for (const tipoObj of data.types) {
                    const nombreTipoIngles = tipoObj.type.name;
                    const respuestaTipo = await fetch(`https://pokeapi.co/api/v2/type/${nombreTipoIngles}`);
                    const dataTipo = await respuestaTipo.json();

                    const nombreTipoEspanol = tiposEnEspanol[nombreTipoIngles] ? tiposEnEspanol[nombreTipoIngles] : nombreTipoIngles;
                    const urlIconoTipo = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${dataTipo.id}.png`;

                    tiposFinal += "<img class='icono-tipo' src='" + urlIconoTipo + "' alt='" + nombreTipoEspanol + "'> " + nombreTipoEspanol + " ";

                    let debilidadesDeEsteTipo = "";
                    dataTipo.damage_relations.double_damage_from.forEach(function (debilidadObj) {
                        const nombreIngles = debilidadObj.name;
                        const nombreEspanol = tiposEnEspanol[nombreIngles] ? tiposEnEspanol[nombreIngles] : nombreIngles;

                        const partesUrl = debilidadObj.url.split("/");
                        const idDebilidad = partesUrl[partesUrl.length - 2];
                        const urlIconoDebilidad = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${idDebilidad}.png`;

                        debilidadesDeEsteTipo += "<img class='icono-tipo' src='" + urlIconoDebilidad + "' alt='" + nombreEspanol + "'> " + nombreEspanol + " ";
                    });

                    debilidadesFinal += "<p>" + nombreTipoEspanol + " es débil contra: " + debilidadesDeEsteTipo + "</p>";
                }
                const movimientosPorNivel = data.moves.filter(function (movimientoObj) {
                    return movimientoObj.version_group_details.some(function (detalle) {
                        return detalle.move_learn_method.name === "level-up";
                    });
                });

                const movimientosConNivel = movimientosPorNivel.map(function (movimientoObj) {
                    const detalleNivel = movimientoObj.version_group_details.find(function (d) {
                        return d.move_learn_method.name === "level-up";
                    });
                    return { nombre: movimientoObj.move.name, nivel: detalleNivel.level_learned_at };
                });

                movimientosConNivel.sort(function (a, b) {
                    return a.nivel - b.nivel;
                });

                let movimientosFinal = "";
                movimientosConNivel.forEach(function (movObj) {
                    movimientosFinal += "<p>Nv. " + movObj.nivel + " - " + movObj.nombre + "</p>";
                });
                // Reproducir el sonido del Pokémon
                const sonido = new Audio(data.cries.latest);
                sonido.play();

                // Guardar la URL del grito actual para poder reproducirlo nuevamente si se desea
                urlGritoActual = data.cries.latest;
                IdActual = data.id;
                // Nombre con primera letra en mayúscula
                const nombreCapitalizado = data.name.charAt(0).toUpperCase() + data.name.slice(1);

                resultado.innerHTML = "<h2>" + nombreCapitalizado + "</h2>" + "<img src='" +
                    imagenFinal + "' alt='" + data.name + "'>"
                    + "<p>Altura: " + (data.height / 10) + " m</p>" + "<p>Peso: " + (data.weight / 10) + " kg</p>"
                    + "<p>Tipo: " + tiposFinal + "</p>" + "<p>Débil contra: " + debilidadesFinal + "</p>" + "<p>Movimientos por nivel: " + movimientosFinal + "</p>" + mensajeLegendario
                    + "<button class='btn-grito'> 🔊 Escuchar de nuevo</button>" + "<button class='btn-anterior'>⬅️ Anterior</button>"
                    + "<button class='btn-siguiente'>Siguiente ➡️</button>";
                input.value = "";
            } catch (error) {
                resultado.innerHTML = "<p>Pokémon no encontrado.</p>";
            }
        }
        button.addEventListener('click', function () {
            buscarPokemon(input.value);
        });
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                buscarPokemon(input.value);
            }
        });
        buttonRandom.addEventListener('click', function () {
            const randomId = Math.floor(Math.random() * 1010) + 1;
            buscarPokemon(randomId);
        });
        resultado.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-grito')) {
                const sonido = new Audio(urlGritoActual);
                sonido.play();
            }
            if (event.target.classList.contains('btn-anterior')) {
                buscarPokemon(IdActual - 1);
            }
            if (event.target.classList.contains('btn-siguiente')) {
                buscarPokemon(IdActual + 1);
            }
        });
    </script>
</body>

</html>
