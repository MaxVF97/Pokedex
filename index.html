<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Black+Ops+One&display=swap" rel="stylesheet">        rel="stylesheet">
    <style>
        :root {
            --rojo: #cc0000;
            --rojo-oscuro: #8f0000;
            --blanco: #ffffff;
            --crema: #fff8f0;
            --negro: #222222;
            --amarillo: #ffcb05;
            --turquesa: #1ecfd4;
            --azul-pokemon: #2450a4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
            background-color: var(--crema);
            color: var(--negro);
            position: relative;
            overflow-x: hidden;
            padding: 30px 15px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icono-flotante {
            position: absolute;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
        }

        .encabezado {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
            border-radius: 16px 16px 40px 16px;
            padding: 20px 25px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
            border: 3px solid var(--negro);
        }

        .luces-pokedex {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .lente-pokedex {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff, var(--turquesa) 45%, #0a7a80 100%);
            border: 4px solid var(--blanco);
            box-shadow: 0 0 0 3px var(--negro), 0 3px 8px rgba(0, 0, 0, 0.4);
            animation: parpadeo 1.6s ease-in-out infinite;
        }

        @keyframes parpadeo {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(0.55);
            }
        }

        .luz {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--negro);
        }

        .luz-roja {
            background-color: #ff3b3b;
            box-shadow: 0 0 8px 2px #ff3b3b;
        }

        .luz-amarilla {
            background-color: var(--amarillo);
            box-shadow: 0 0 8px 2px var(--amarillo);
        }

        .luz-verde {
            background-color: #4fd66b;
            box-shadow: 0 0 8px 2px #4fd66b;
        }

        h1 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            color: var(--amarillo);
            text-align: center;
            margin: 5px 0 18px 0;
            font-size: 68px;
            letter-spacing: 1px;
            -webkit-text-stroke: 4px var(--azul-pokemon);
            text-shadow:
                4px 4px 0 var(--azul-pokemon),
                7px 7px 0 #1a3a7a;
            line-height: 1;
        }

        .fila-input {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        #pokemon-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        #btn-buscar,
        #btn-random {
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--negro);
            background-color: var(--blanco);
            color: var(--rojo);
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-buscar:hover,
        #btn-random:hover {
            background-color: var(--amarillo);
            transform: translateY(-1px);
        }

        .signo-interrogacion {
            color: var(--amarillo);
            -webkit-text-stroke: 1px var(--negro);
            font-weight: 800;
            font-size: 16px;
        }

        .tarjeta {
            width: 100%;
            max-width: 900px;
            background-color: var(--blanco);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border: 3px solid var(--color-tipo, var(--rojo));
            overflow: hidden;
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .tarjeta>div {
            padding: 20px;
        }

        .seccion-info {
            border-right: 2px dashed #ecd6d6;
        }

        .seccion-debilidades {
            border-right: 2px dashed #ecd6d6;
        }

        .tarjeta h2 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--color-tipo, var(--rojo-oscuro));
            text-align: center;
            font-size: 26px;
        }

        .tarjeta h3,
        .tarjeta h4 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            color: var(--blanco);
            background-color: var(--color-tipo, var(--rojo));
            padding: 7px 12px;
            border-radius: 8px;
            margin: 0 0 14px 0;
            text-align: center;
        }

        .seccion-info img:first-of-type {
            display: block;
            margin: 0 auto 12px;
            max-width: 130px;
            image-rendering: pixelated;
        }

        .estadisticas {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .chip-estadistica {
            background-color: var(--crema);
            border: 1.5px solid var(--color-tipo, var(--rojo));
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .fila-insignias {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 10px 0;
        }

        .insignia {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 58px;
        }

        .insignia .icono-tipo {
            width: 30px;
            height: 30px;
            border-radius: 7px;
        }

        .insignia span {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
        }

        .bloque-debilidad-tipo {
            margin-bottom: 14px;
        }

        .bloque-debilidad-tipo strong {
            display: block;
            text-align: center;
            color: var(--color-tipo, var(--rojo-oscuro));
            margin-bottom: 6px;
        }

        .seccion-movimientos {
            display: flex;
            flex-direction: column;
        }

        .lista-movimientos {
            max-height: 260px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .lista-movimientos p {
            margin: 4px 0;
            padding: 6px 10px;
            background-color: var(--crema);
            border-left: 3px solid var(--color-tipo, var(--rojo));
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .lista-movimientos::-webkit-scrollbar {
            width: 6px;
        }

        .lista-movimientos::-webkit-scrollbar-thumb {
            background-color: var(--color-tipo, var(--rojo));
            border-radius: 10px;
        }

        .fila-botones {
            grid-column: 1 / -1;
            background-color: var(--crema);
            border-top: 2px solid var(--color-tipo, var(--rojo));
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 16px;
        }

        .fila-botones button {
            padding: 14px 22px;
            min-width: 130px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-tipo, var(--rojo));
            color: var(--blanco);
            font-family: 'Baloo 2', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .fila-botones button:hover {
            filter: brightness(0.85);
            transform: translateY(-2px);
        }

        .fila-botones .btn-grito {
            background-color: var(--negro);
        }

        .tarjeta.legendaria {
            position: relative;
            animation: pulso-legendario 2.8s ease-in-out infinite;
        }

        @keyframes pulso-legendario {

            0%,
            100% {
                border-color: var(--color-tipo, var(--rojo));
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 18px 2px var(--color-tipo, var(--rojo));
            }

            50% {
                border-color: #e8e8ec;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 26px 6px rgba(255, 255, 255, 0.85);
            }
        }

        .tarjeta.legendaria::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 35%;
            height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-20deg);
            animation: destello-legendario 2.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }

        @keyframes destello-legendario {
            0% {
                left: -60%;
            }

            55% {
                left: 130%;
            }

            100% {
                left: 130%;
            }
        }

        /* --- Texto "Pokémon Legendario": plata metálica + borde del color del tipo --- */
        .texto-legendario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 14px 0;
            background: linear-gradient(90deg, #b8860b 10%, #ffe9a8 35%, #fff8e0 50%, #ffe9a8 65%, #b8860b 90%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1.5px var(--color-tipo, var(--rojo));
            animation: brillo-texto 4s linear infinite;
        }

        @keyframes brillo-texto {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: -250% center;
            }
        }

        .estrella-legendaria {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            animation: parpadeo-estrella 4s ease-in-out infinite;
        }

        @keyframes parpadeo-estrella {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.6);
            }
        }

        @media (max-width: 750px) {
            .tarjeta {
                grid-template-columns: 1fr;
            }

            .seccion-info,
            .seccion-debilidades {
                border-right: none;
                border-bottom: 2px dashed #ecd6d6;
            }

            .icono-flotante {
                display: none;
            }

            h1 {
                font-size: 40px;
                -webkit-text-stroke: 2.5px var(--azul-pokemon);
                text-shadow: 2.5px 2.5px 0 var(--azul-pokemon), 4px 4px 0 #1a3a7a;
            }

            .lente-pokedex {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

    <script>
        // Obtener referencias a los elementos del DOM
        const input = document.getElementById('pokemon-input');
        const button = document.getElementById('btn-buscar');
        const resultado = document.getElementById('resultado');
        const buttonRandom = document.getElementById('btn-random');
        let urlGritoActual = "";
        let IdActual = null;

        const tiposEnEspanol = {
            normal: "Normal", fire: "Fuego", water: "Agua", electric: "Eléctrico",
            grass: "Planta", ice: "Hielo", fighting: "Lucha", poison: "Veneno",
            ground: "Tierra", flying: "Volador", psychic: "Psíquico", bug: "Bicho",
            rock: "Roca", ghost: "Fantasma", dragon: "Dragón", dark: "Siniestro",
            steel: "Acero", fairy: "Hada"
        };

        const coloresPorTipo = {
            normal: "#a8a878", fire: "#e8620f", water: "#4287f5", electric: "#e8c000",
            grass: "#4caf50", ice: "#5cd0d0", fighting: "#c03028", poison: "#a040a0",
            ground: "#d9a441", flying: "#8f7dea", psychic: "#f85888", bug: "#8fa021",
            rock: "#b8a038", ghost: "#6a5698", dragon: "#5537d6", dark: "#5b4a3f",
            steel: "#7d7d99", fairy: "#e57ea0"
        };

        function buscarEnCadena(nodo, nombreBuscado) {
            if (nodo.species.name === nombreBuscado) {
                return nodo;
            }
            for (const hijo of nodo.evolves_to) {
                const encontrado = buscarEnCadena(hijo, nombreBuscado);
                if (encontrado) {
                    return encontrado;
                }
            }
            return null;
        }

        async function buscarPokemon(valor) {
            const pokemonName = valor;
            resultado.innerHTML = "<p style='text-align:center; padding:30px;'>Buscando...</p>";

            try {
                const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);
                const data = await respuesta.json();

                const respuestaEspecie = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonName}`);
                const dataEspecie = await respuestaEspecie.json();

                const iconoEstrella = "<svg class='estrella-legendaria' viewBox='0 0 24 24'><path d='M12 2 L14.9 8.6 L22 9.3 L16.5 14.1 L18.2 21 L12 17.3 L5.8 21 L7.5 14.1 L2 9.3 L9.1 8.6 Z' fill='url(#gradientePlata)' stroke='var(--color-tipo, var(--rojo))' stroke-width='1.2'/></svg>";
                const defsGradiente = "<svg width='0' height='0'><defs><linearGradient id='gradientePlata' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#8a8a8a'/><stop offset='40%' stop-color='#f5f5f5'/><stop offset='60%' stop-color='#ffffff'/><stop offset='100%' stop-color='#8a8a8a'/></linearGradient></defs></svg>";

                const mensajeLegendario = dataEspecie.is_legendary ? defsGradiente + "<p class='texto-legendario'>" + iconoEstrella + "Pokémon Legendario" + iconoEstrella + "</p>" : "";

                const respuestaCadena = await fetch(dataEspecie.evolution_chain.url);
                const dataCadena = await respuestaCadena.json();

                const nodoActual = buscarEnCadena(dataCadena.chain, data.name);
                let piedraFinal = "";

                if (nodoActual) {
                    for (const hijo of nodoActual.evolves_to) {
                        const detalle = hijo.evolution_details[0];
                        if (detalle.trigger.name === "use-item") {
                            const nombrePiedra = detalle.item.name;
                            const urlIconoPiedra = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${nombrePiedra}.png`;
                            const nombrePiedraFormateado = nombrePiedra.split("-").map(function (palabra) {
                                return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                            }).join(" ");
                            piedraFinal += "<div class='insignia' style='margin:12px auto;'><img class='icono-tipo' style='width:36px;height:36px;' src='" + urlIconoPiedra + "' alt='" + nombrePiedraFormateado + "'><span>Evoluciona con " + nombrePiedraFormateado + "</span></div>";
                        }
                    }
                }

                const spriteAnimado = data.sprites.versions["generation-v"]["black-white"].animated.front_default;
                const imagenFinal = spriteAnimado ? spriteAnimado : data.sprites.front_default;

                const tipoPrincipalIngles = data.types[0].type.name;
                const colorTipoPrincipal = coloresPorTipo[tipoPrincipalIngles] ? coloresPorTipo[tipoPrincipalIngles] : "#cc0000";

                let tiposFinal = "";
                let debilidadesFinal = "";
                for (const tipoObj of data.types) {
                    const nombreTipoIngles = tipoObj.type.name;
                    const respuestaTipo = await fetch(`https://pokeapi.co/api/v2/type/${nombreTipoIngles}`);
                    const dataTipo = await respuestaTipo.json();

                    const nombreTipoEspanol = tiposEnEspanol[nombreTipoIngles] ? tiposEnEspanol[nombreTipoIngles] : nombreTipoIngles;
                    const urlIconoTipo = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${dataTipo.id}.png`;

                    tiposFinal += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoTipo + "' alt='" + nombreTipoEspanol + "'><span>" + nombreTipoEspanol + "</span></div>";

                    let insigniasDebilidad = "";
                    dataTipo.damage_relations.double_damage_from.forEach(function (debilidadObj) {
                        const nombreIngles = debilidadObj.name;
                        const nombreEspanol = tiposEnEspanol[nombreIngles] ? tiposEnEspanol[nombreIngles] : nombreIngles;

                        const partesUrl = debilidadObj.url.split("/");
                        const idDebilidad = partesUrl[partesUrl.length - 2];
                        const urlIconoDebilidad = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-viii/brilliant-diamond-shining-pearl/small/${idDebilidad}.png`;

                        insigniasDebilidad += "<div class='insignia'><img class='icono-tipo' src='" + urlIconoDebilidad + "' alt='" + nombreEspanol + "'><span>" + nombreEspanol + "</span></div>";
                    });

                    debilidadesFinal += "<div class='bloque-debilidad-tipo'><strong>" + nombreTipoEspanol + "</strong><div class='fila-insignias'>" + insigniasDebilidad + "</div></div>";
                }

                const movimientosPorNivel = data.moves.filter(function (movimientoObj) {
                    return movimientoObj.version_group_details.some(function (detalle) {
                        return detalle.move_learn_method.name === "level-up";
                    });
                });

                const movimientosConNivel = movimientosPorNivel.map(function (movimientoObj) {
                    const detalleNivel = movimientoObj.version_group_details.find(function (d) {
                        return d.move_learn_method.name === "level-up";
                    });
                    return { nombre: movimientoObj.move.name, nivel: detalleNivel.level_learned_at };
                });

                movimientosConNivel.sort(function (a, b) {
                    return a.nivel - b.nivel;
                });

                let movimientosFinal = "";
                movimientosConNivel.forEach(function (movObj) {
                    const nombreFormateado = movObj.nombre.split("-").map(function (palabra) {
                        return palabra.charAt(0).toUpperCase() + palabra.slice(1);
                    }).join(" ");
                    movimientosFinal += "<p>Nv. " + movObj.nivel + " - " + nombreFormateado + "</p>";
                });

                const sonido = new Audio(data.cries.latest);
                sonido.play();

                urlGritoActual = data.cries.latest;
                IdActual = data.id;
                const nombreCapitalizado = data.name.charAt(0).toUpperCase() + data.name.slice(1);

                const claseLegendaria = dataEspecie.is_legendary ? " legendaria" : "";

                resultado.innerHTML =
                    "<div class='tarjeta" + claseLegendaria + "' style='--color-tipo: " + colorTipoPrincipal + ";'>" +
                    "<div class='seccion-info'>" +
                    "<h2>" + nombreCapitalizado + "</h2>" +
                    "<img src='" + imagenFinal + "' alt='" + data.name + "'>" +
                    "<div class='estadisticas'>" +
                    "<div class='chip-estadistica'>#" + data.id + "</div>" +
                    "<div class='chip-estadistica'>📏 " + (data.height / 10) + " m</div>" +
                    "<div class='chip-estadistica'>⚖️ " + (data.weight / 10) + " kg</div>" +
                    "</div>" +
                    "<div class='fila-insignias'>" + tiposFinal + "</div>" +
                    mensajeLegendario + piedraFinal +
                    "</div>" +
                    "<div class='seccion-debilidades'>" +
                    "<h4>Debilidades</h4>" +
                    debilidadesFinal +
                    "</div>" +
                    "<div class='seccion-movimientos'>" +
                    "<h3>Movimientos</h3>" +
                    "<div class='lista-movimientos'>" + movimientosFinal + "</div>" +
                    "</div>" +
                    "<div class='fila-botones'>" +
                    "<button class='btn-grito'>🔊 Escuchar de nuevo</button>" +
                    "<button class='btn-anterior'>⬅️ Anterior</button>" +
                    "<button class='btn-siguiente'>Siguiente ➡️</button>" +
                    "</div>" +
                    "</div>";
                input.value = "";
            } catch (error) {
                resultado.innerHTML = "<p style='text-align:center; padding:30px;'>Pokémon no encontrado.</p>";
            }
        }

        button.addEventListener('click', function () {
            buscarPokemon(input.value);
        });
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                buscarPokemon(input.value);
            }
        });
        buttonRandom.addEventListener('click', function () {
            const randomId = Math.floor(Math.random() * 1010) + 1;
            buscarPokemon(randomId);
        });
        resultado.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-grito')) {
                const sonido = new Audio(urlGritoActual);
                sonido.play();
            }
            if (event.target.classList.contains('btn-anterior')) {
                buscarPokemon(IdActual - 1);
            }
            if (event.target.classList.contains('btn-siguiente')) {
                buscarPokemon(IdActual + 1);
            }
        });
    </script>
</body>

</html>
